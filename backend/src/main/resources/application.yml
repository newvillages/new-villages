spring:
  application:
    name: newvillages-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?prepareThreshold=0&preparedStatementCacheQueries=0${DB_PARAMS:}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Admin}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      validation-timeout: 5000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:*}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,https://newvillages.ca,https://www.newvillages.ca}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-change-me-32bytes}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:1}
  mail:
    from: ${MAIL_FROM:contact@newvillages.ca}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://newvillages.ca}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: ${UPLOADS_BASE_URL:https://new-villages.onrender.com/uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-leader: ${STRIPE_PRICE_LEADER:}
    price-organization: ${STRIPE_PRICE_ORGANIZATION:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/pricing?checkout=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/pricing?checkout=cancelled}
  terms:
    seed-version: 1.0.0
  seed:
    admin-email: ${ADMIN_SEED_EMAIL:admin@newvillages.ca}
    admin-password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.onevillage.backend: DEBUG
    org.hibernate.SQL: WARN

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
